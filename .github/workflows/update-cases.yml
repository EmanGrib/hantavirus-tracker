name: Fetch Hantavirus Cases

on:
  schedule:
    # Run every hour at minute 0
    - cron: "0 * * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

jobs:
  update-cases:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --include=dev

      - name: Fetch new hantavirus cases
        run: node scripts/fetch-cases.js

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet public/cases.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if cases changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Hantavirus Tracker Bot"
          git config user.email "emangrib@gmail.com"
          git add public/cases.json
          git commit -m "auto: update cases.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
